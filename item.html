<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>產品服務|小雅家飾概念</title><link rel="icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500&family=Noto+Serif+TC:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css"></head><body id="top">
<main id="m"></main>
<script src="site.js"></script>
<script>boot(d=>{
  const m=$('#m'),cid=param('c'),iid=param('i'),p=(d.products||[]).find(x=>hid(x.name)===cid),it=p&&(p.items||[]).find(x=>hid(x.name)===iid);
  const sec=()=>{const s=el('section'),w=el('div');w.className='wrap';s.append(w);m.append(s);return w};
  if(!it){m.append(pageHead('PRODUCT','產品服務',[['首頁','index.html'],['產品服務','products.html']]));
    const w=sec();w.append(el('p','找不到這個項目。',{className:'empty'}),el('a','← 回到產品服務',{href:'products.html',className:'back'}));return}
  const cu='category.html?c='+cid;
  document.title=it.name+'|'+p.name+'|小雅家飾概念';
  m.append(pageHead('PRODUCT',it.name,[['首頁','index.html'],['產品服務','products.html'],[p.name,cu],[it.name]]));
  const w=sec();
  const notice=d.product_notice===undefined||d.product_notice===null?NOTICE:d.product_notice;
  if(notice)w.append(el('p',notice,{className:'note'}));
  if(it.desc){const l=el('div');l.className='lead';paras(l,it.desc);w.append(l)}
  const fs=String(it.features||'').split(/\n/).map(x=>x.trim()).filter(Boolean);
  if(fs.length){const u=el('ul');u.className='feat';fs.forEach(f=>u.append(el('li',f)));w.append(u)}
  const pics=[...(it.photos||[])];if(!pics.length&&it.image)pics.push(it.image);
  if(pics.length)w.append(photoGrid(pics,it.name));else w.append(el('p','照片整理中,敬請期待。',{className:'empty'}));
  const cta=el('div');cta.className='cta';cta.append(el('h2','想了解更多?歡迎預約丈量與諮詢'),el('p','現場看樣、丈量與報價,我們都能協助。'));
  if(d.phone)cta.append(el('a','撥打電話 '+d.phone,{className:'btn',href:'tel:'+d.phone.replace(/[^\d+]/g,'').replace(/^0/,'+886')}));
  if(d.facebook)cta.append(el('a','Facebook 私訊',{className:'btn o',href:d.facebook,target:'_blank',rel:'noopener'}));
  cta.append(el('a','聯絡資訊',{className:'btn o',href:'#contact'}));w.append(cta);
  const sib=(p.items||[]);if(sib.length>1){const s=el('div');s.className='sib';s.append(el('h3','其他'+p.name+'項目'));
    sib.forEach(x=>{const a=el('a',x.name,{href:'item.html?c='+cid+'&i='+hid(x.name)});if(x===it)a.className='on';s.append(a)});w.append(s)}
})</script></body></html>
