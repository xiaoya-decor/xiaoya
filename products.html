<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>產品|小雅家飾概念</title><link rel="icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500&family=Noto+Serif+TC:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css"></head><body id="top">
<main><div class="pagehead"><div class="wrap"><h1 id="ptitle">產品</h1><p>窗簾・壁紙・地板・皮革</p></div></div>
<section><div class="wrap"><div class="grid" id="grid"></div></div></section>
<section class="alt" id="projects" hidden><div class="wrap"><h2 id="jtitle">作品案例</h2><div class="grid" id="jgrid"></div></div></section></main>
<script src="site.js"></script>
<script>boot(d=>{
  (d.products||[]).forEach(p=>card($('#grid'),p,p.name,p.desc));
  if((d.projects||[]).length){$('#projects').hidden=false;$('#jtitle').textContent=d.projects_title||'作品案例';d.projects.forEach(p=>card($('#jgrid'),p,p.title,p.desc))}
})</script></body></html>
