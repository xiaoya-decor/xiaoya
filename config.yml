backend:
  name: github
  repo: xiaoya-decor/xiaoya
  branch: main
locale: zh-Hant
media_folder: images
public_folder: images
collections:
  - name: pages
    label: 網站內容
    files:
      - name: site
        label: 官網內容
        file: site.json
        format: json
        fields:
          - {name: logo, label: 標誌圖片, widget: image}
          - {name: tagline, label: 主標語, widget: string}
          - {name: tagline_en, label: 英文標語, widget: string}
          - {name: hero_image, label: 首頁大圖(選填,放店面或作品照,有放才會當背景), widget: image, required: false}
          - {name: products_title, label: 產品區標題, widget: string}
          - name: products
            label: 產品列表
            label_singular: 產品
            widget: list
            summary: "{{fields.name}}"
            fields:
              - {name: name, label: 名稱, widget: string}
              - {name: desc, label: 說明, widget: text}
              - {name: image, label: 封面照片, widget: image, required: false}
              - {name: gallery, label: 更多照片, widget: list, field: {name: photo, label: 照片, widget: image}, required: false}
          - {name: projects_title, label: 作品案例標題, widget: string, required: false, hint: "例如:作品案例。沒有作品時整區不會顯示"}
          - name: projects
            label: 作品案例
            label_singular: 案例
            widget: list
            required: false
            summary: "{{fields.title}}"
            fields:
              - {name: title, label: 標題, widget: string}
              - {name: desc, label: 說明, widget: text, required: false}
              - {name: image, label: 封面照片, widget: image}
              - {name: gallery, label: 更多照片, widget: list, field: {name: photo, label: 照片, widget: image}, required: false}
          - {name: news_title, label: 最新消息標題, widget: string, required: false, hint: "例如:最新消息。沒有消息時整區不會顯示"}
          - name: news
            label: 最新消息
            label_singular: 消息
            widget: list
            required: false
            summary: "{{fields.date}} {{fields.title}}"
            fields:
              - {name: date, label: 日期, widget: string, hint: "例如:2026/10/15"}
              - {name: title, label: 標題, widget: string}
              - {name: summary, label: 簡短摘要(列表上顯示,可留空), widget: string, required: false}
              - {name: image, label: 封面照片, widget: image, required: false}
              - {name: body, label: 文章內容(空一行即分段), widget: text, required: false}
              - {name: gallery, label: 文章內更多照片, widget: list, field: {name: photo, label: 照片, widget: image}, required: false}
          - {name: about, label: 關於我們(空一行即分段), widget: text}
          - {name: about_image, label: 關於我們照片, widget: image, required: false}
          - {name: address, label: 地址, widget: string}
          - {name: phone, label: 電話, widget: string}
          - {name: email, label: E-mail, widget: string}
          - {name: hours, label: 營業時間, widget: string, required: false}
          - {name: facebook, label: Facebook 連結, widget: string, required: false}
